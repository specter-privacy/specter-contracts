[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
metadata = true
metadata_hash = "none"
use_literal_content = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

# Sourcify verification — do NOT add an [etherscan] block here; it conflicts with
# the Sourcify verifier in Foundry 1.2+. Use the forge verify-contract command directly:
#
#   forge verify-contract \
#     --rpc-url $MONAD_TESTNET_RPC \
#     --verifier sourcify \
#     --verifier-url 'https://sourcify-api-monad.blockvision.org/' \
#     <address> src/SPECTERAnnouncer.sol:SPECTERAnnouncer

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
